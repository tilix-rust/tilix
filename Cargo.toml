[package]
name = "tilix"
version = "0.16.1"
edition = "2021"

[lib]
name = "tilix"
path = "src/lib.rs"

[[bin]]
name = "tilix"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_18"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
vte4 = { version = "0.10", features = ["v0_76"] }
glib = "0.22"
gio = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
libc = "0.2"
